<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홍길동 — 소개</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Pretendard:wght@400;500;600&display=swap');

  :root{
    --paper: #eef1e9;
    --ink: #22301f;
    --pine: #34492e;
    --clay: #b5652e;
    --line: #c9cdb9;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, sans-serif;
    line-height: 1.7;
  }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: 80px 24px 100px;
  }

  header{
    margin-bottom: 64px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 40px;
  }

  .eyebrow{
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--clay);
    text-transform: uppercase;
    margin-bottom: 14px;
    font-weight: 600;
  }

  h1{
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(36px, 6vw, 52px);
    margin: 0 0 16px;
    font-weight: 700;
    color: var(--pine);
  }

  .tagline{
    font-size: 18px;
    color: #4a5847;
    max-width: 480px;
  }

  section{
    margin-bottom: 56px;
  }

  h2{
    font-family: 'Noto Serif KR', serif;
    font-size: 22px;
    color: var(--pine);
    margin: 0 0 20px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  h2::before{
    content: "";
    width: 22px;
    height: 2px;
    background: var(--clay);
    display: inline-block;
  }

  p{ margin: 0 0 14px; color: #3a4536; }

  .cards{
    display: grid;
    gap: 14px;
  }

  .card{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 18px 20px;
  }

  .card b{ color: var(--pine); }

  .records{
    display: flex;
    flex-direction: column;
  }

  .record{
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 16px 4px;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: inherit;
  }

  .record:first-child{
