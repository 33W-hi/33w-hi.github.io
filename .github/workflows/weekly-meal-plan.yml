name: Weekly Meal Plan

on:
  schedule:
    # 매주 일요일 00:00 UTC = 09:00 KST(한국시간)
    - cron: '0 0 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 식단표 생성
        run: node scripts/generate-meal-plan.js

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/current_week.json
          git diff --cached --quiet || git commit -m "주간 식단 자동 생성 $(date +'%Y-%m-%d')"
          git push
