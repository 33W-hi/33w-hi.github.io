---
layout: default
---
<article>
  <div class="post-header">
    <span class="post-date">{{ page.date | date: "%Y.%m.%d" }}</span>
    <h2 class="post-title">{{ page.title }}</h2>
  </div>
  <div class="post-content">
    {{ content }}
  </div>
  <a class="back-link" href="{{ '/' | relative_url }}">← 목록으로</a>
</article>
